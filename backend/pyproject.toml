[project]
name = "manufacturaiq-backend"
version = "0.1.0"
description = "ManufacturaIQ backend foundation and shared contracts"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.5.0",
  "uvicorn>=0.54.0",
  "aiosqlite>=0.20.0",
  "numpy>=1.26.0",
  "pyarrow>=15.0.0",
  "PyMuPDF>=1.24.0",
  "qdrant-client>=1.10.0",
  "sentence-transformers>=3.0.0",
  "langgraph>=1.0.0,<2.0.0",
  "typesafe-sdk>=0.7.0",
  "google-genai>=2.22.0,<3",
  "bcrypt>=4.1.0",
  "PyJWT>=2.8.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "tests*", "scripts*"]
namespaces = false
